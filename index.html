<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1A15">
<meta name="description" content="אפליקציית הטיול לקוסטה ריקה, 24.11–16.12.2026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קוסטה ריקה">
<title>קוסטה ריקה 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: one-column phone app, header band + scrolling content + fixed 3-tab bar; dark night-jungle look committed in one theme */
:root{
  --bg:#0F1A15; --surface:#1A2A22; --surface-2:#22352B; --bar:#16241D; --line:#2C3D34;
  --fg:#F3F1EA; --fg-2:#E4E8E2; --muted:#B7C2BB; --accent:#F2B544; --on-accent:#0F1A15;
  --warn-bg:#3A2E12; --rain:#8EC5E8;
  --font:'Rubik', 'Assistant', 'Arial Hebrew', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.45;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.gut{padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px))}
header.band{background:var(--surface);padding-block:22px;display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-size:32px;font-weight:800;line-height:1.1;text-wrap:balance}
h2{margin:0;font-size:22px;font-weight:800;text-wrap:balance}
h3{margin:0;font-size:20px;font-weight:700}
.sub{margin:0;font-size:17px;color:var(--muted)}
.back{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:6px;font-size:17px;text-decoration:none;margin-inline-start:-6px;padding-inline:6px}
main{flex-grow:1;padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
.label{margin:0;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.02em}
section.blk{display:flex;flex-direction:column;gap:10px}

/* home */
.today-date{font-size:18px;color:var(--fg-2);margin:0}
.count{display:flex;align-items:baseline;gap:12px;margin-top:6px}
.count b{font-size:64px;font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:20px;font-weight:500}
.wx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wx-tile{background:var(--surface);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;text-decoration:none;color:var(--fg);min-width:0}
.wx-tile.now{outline:2px solid var(--accent)}
.wx-day{font-size:15px;font-weight:700;color:var(--muted)}
.wx-place{font-size:15px;font-weight:500;line-height:1.25;min-height:2.5em;display:flex;align-items:center}
.wx-t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.wx-t small{font-size:16px;font-weight:500;color:var(--muted)}
.wx-c{font-size:14px;color:var(--muted)}
.note-sm{margin:0;font-size:14px;color:var(--muted)}
.wx.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.wx-tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.wx-today{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;outline:2px solid var(--accent)}
.wt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wt-top>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.wt-big{font-size:44px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.wt-big small{font-size:22px;font-weight:500;color:var(--muted)}
.wt-ph{font-size:18px;color:var(--fg-2)}
.wt-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:16px;color:var(--fg-2)}
.wt-meta b{color:var(--fg)}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.hr{flex-shrink:0;width:60px;background:var(--bg);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.hr .ht{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.hr .hv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.hr .hp{font-size:13px;color:var(--rain);font-variant-numeric:tabular-nums}
.summary{border:2px solid var(--accent);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.summary .loc{font-size:24px;font-weight:800}
.summary ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.summary li{display:flex;gap:10px;align-items:flex-start;font-size:18px;line-height:1.4}
.summary li svg{flex-shrink:0;margin-top:2px}
.linkbtn{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:700;text-decoration:none}

/* cards */
.card{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card.hl{background:transparent;border:2px solid var(--accent)}
.chip{align-self:flex-start;font-size:15px;font-weight:700;border-radius:8px;padding:4px 10px;background:var(--accent);color:var(--on-accent)}
.chip.ghost{background:transparent;color:var(--fg);border:1px solid var(--muted);padding:3px 10px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.head .d{font-size:17px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kv.top{border-top:1px solid var(--line);padding-top:14px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:15px;color:var(--muted)}
.kv strong{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.code{letter-spacing:.06em;font-variant-numeric:tabular-nums}
.btn{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;font:inherit;font-size:18px;font-weight:700;text-decoration:none;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);padding-inline:10px}
.btn.out{background:transparent;color:var(--accent)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.notice{background:var(--warn-bg);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5}
.notice svg{flex-shrink:0;margin-top:2px}
.bullets{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--fg-2)}

/* bookings tiles */
.tiles{display:flex;flex-direction:column;gap:12px}
.tile{background:var(--surface);border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center;text-decoration:none;color:var(--fg);min-height:96px}
.tile .ic{width:56px;height:56px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile .tx{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0}
.tile .tt{font-size:22px;font-weight:800}
.tile .ts{font-size:16px;color:var(--muted)}
.tile .ch{flex-shrink:0;transform:scaleX(-1)}

/* flights */
.seg{display:flex;flex-direction:column;gap:10px}
.ends{display:flex;justify-content:space-between;align-items:center;gap:8px}
.end{display:flex;flex-direction:column;min-width:0}
.end:last-child{align-items:flex-end;text-align:left}
.end .tm{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.end .ap{font-size:18px;font-weight:700}
.end .ci{font-size:15px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:16px;color:var(--fg-2)}
.old{font-size:15px;color:var(--muted);text-decoration:line-through}
.lay{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:16px;color:var(--muted)}
.lay b{color:var(--fg)}

/* hotels */
details.hotel{background:var(--surface);border-radius:18px;overflow:hidden}
details.hotel[open]{background:transparent;border:2px solid var(--line)}
details.hotel.next{border:2px solid var(--accent)}
details.hotel summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:14px;align-items:center;min-height:72px}
details.hotel summary::-webkit-details-marker{display:none}
.nights{flex-shrink:0;width:52px;text-align:center;display:flex;flex-direction:column;line-height:1.1}
.nights b{font-size:26px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.nights span{font-size:13px;color:var(--muted)}
.hsum{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hsum .n{font-size:19px;font-weight:700;line-height:1.25}
.hsum .s{font-size:15px;color:var(--muted)}
.chev{flex-shrink:0;transition:transform .15s}
details[open] .chev{transform:rotate(180deg)}
.hbody{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.addr{font-size:16px;color:var(--fg-2);margin:0;user-select:text}

/* journey */
.daypick{display:flex;gap:8px;overflow-x:auto;padding-block:4px 2px;scrollbar-width:none}
.daypick::-webkit-scrollbar{display:none}
.daypick button{flex-shrink:0;min-width:52px;min-height:56px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0 6px}
.daypick button small{font-size:12px}
.daypick button b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.daypick button.today{border-color:var(--accent);color:var(--fg)}
.pickbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--surface);padding-block:10px;border-bottom:1px solid var(--line)}
.daypick button.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:calc(100px + env(safe-area-inset-top,0px))}
.day.today{background:transparent;border:2px solid var(--accent)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.day .dn{font-size:15px;font-weight:700;color:var(--accent)}
.day .dd{font-size:15px;color:var(--muted)}
.day h3{font-size:22px;font-weight:800}
.tl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.tl li{display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.45}
.tl li svg{flex-shrink:0;margin-top:3px}
.tl li .m{color:var(--muted);font-size:15px}
.tip{font-size:15px;color:var(--fg-2);background:var(--bg);border-radius:12px;padding:10px 12px;margin:0}
.tl.log{background:var(--bg);border-radius:12px;padding:12px;gap:8px}
.tl.log li{font-size:15px;color:var(--fg-2)}
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.act{position:relative;padding-inline-start:22px;display:flex;flex-direction:column;gap:4px}
.act::before{content:"";position:absolute;inset-inline-start:3px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.act.alt::before,.act.opt::before{background:transparent;border:2px solid var(--muted);width:6px;height:6px}
.act.free::before{background:var(--muted)}
.an{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.an b{font-size:19px;font-weight:700}
.act p{margin:0;font-size:17px;color:var(--fg-2);line-height:1.45}
.act p.atip{font-size:16px;color:var(--fg)}
p.ag{margin:0;font-size:15px;color:var(--muted)}
.dchip{font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap}
.dchip.e{background:#1F4D36;color:#A8E6C1}
.dchip.m{background:#4A3A12;color:#FFD27A}
.dchip.h{background:#5A2214;color:#FFB4A0}
.act p.dwhy{font-size:15px;color:var(--fg-2)}
.kchip{font-size:13px;border:1px solid var(--muted);border-radius:6px;padding:1px 7px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.lk{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--accent);text-decoration:none;font-size:15px;font-weight:700}
ul.info{margin:2px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--fg-2);line-height:1.45}
.bringwrap{display:flex;flex-direction:column;gap:6px}
.bring{display:flex;flex-wrap:wrap;gap:6px}
.bring span{font-size:14px;background:var(--bg);border-radius:8px;padding:5px 10px;color:var(--fg-2)}
.check{display:flex;flex-direction:column;gap:10px}
.ck{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.ck input{width:26px;height:26px;margin:2px 0 0;accent-color:var(--accent);flex-shrink:0}
.ck label{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0;cursor:pointer}
.ck .cd{font-size:14px;color:var(--accent);font-weight:700}
.ck .ct{font-size:18px;font-weight:700}
.ck .cm{font-size:15px;color:var(--muted)}
.ck.done .ct{text-decoration:line-through;color:var(--muted)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--bar);padding-top:8px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px));z-index:5;border-top:1px solid var(--line)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
nav.tabs a{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-size:17px;color:var(--muted);text-decoration:none}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:16px;font-weight:700;z-index:6}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
</head>

const d0 = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const isoOf = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const addDays = (iso, n) => { const t = d0(iso); t.setDate(t.getDate()+n); return isoOf(t); };
const diffDays = (a, b) => Math.round((d0(b) - d0(a)) / DAY);
const short = iso => { const t = d0(iso); return `${t.getDate()}.${t.getMonth()+1}`; };
const longDate = iso => { const t = d0(iso); return `יום ${WD[t.getDay()]}, ${t.getDate()} ב${MON[t.getMonth()]}`; };

/* ================= בית ================= */
function wxTile(iso, label, isNow){
  const d = dayOf(iso);
  if (!d) return '';
  const c = CLIMATE[d.place] || {hi:'–',lo:'–',c:'cloud',t:''};
  const col = c.c === 'rain' ? 'var(--rain)' : 'var(--accent)';
  return `<a class="wx-tile ${isNow ? 'now' : ''}" href="${wxUrl(d.place)}" target="_blank" rel="noopener" aria-label="${label}: ${esc(d.place)}, ${c.hi} עד ${c.lo} מעלות, ${c.t}. פתיחת תחזית חיה">
    <span class="wx-day">${label}</span>
    ${icon(c.c, 34, col)}
    <span class="wx-t">${c.hi}°<small> / ${c.lo}°</small></span>
    <span class="wx-place">${esc(d.place)}</span>
    <span class="wx-c">${c.t}</span>
  </a>`;
}

/* תחזית אמיתית – נכתבת כל בוקר ע"י משימה מתוזמנת למסמך weather/current */
let WX = null;
const num = v => { const n = Number(v); return Number.isFinite(n) ? Math.round(n) : '–'; };
const accIc = n => { n = Number(n); return (n<=2||n===33||n===34) ? 'sun' : (n<=5||(n>=35&&n<=37)) ? 'partly' : (n<=11||n===38) ? 'cloud' : 'rain'; };
const fcOf = iso => (WX && Array.isArray(WX.days)) ? (WX.days.find(x => x && x.date === iso) || null) : null;
const updatedLabel = () => { if (!WX || !WX.updatedAt) return ''; const m = String(WX.updatedAt).match(/T(\d\d:\d\d)/); const dm = String(WX.updatedAt).match(/^\d{4}-(\d\d)-(\d\d)/); return m ? `${dm ? Number(dm[2]) + '.' + Number(dm[1]) + ' ' : ''}${m[1]}` : ''; };

function wxCompact(iso, label){
  const d = dayOf(iso); if (!d) return '';
  const f = fcOf(iso);
  if (!f) return wxTile(iso, label, false).replace('<span class="wx-c">', '<span class="wx-tag">ממוצע</span><span class="wx-c">');
  const ic = f.ic || accIc(f.icon), col = ic === 'rain' ? 'var(--rain)' : 'var(--accent)';
  return `<a class="wx-tile" href="${wxUrl(d.place)}" target="_blank" rel="noopener" aria-label="${label}: ${esc(d.place)}, ${num(f.hi)} עד ${num(f.lo)} מעלות, ${num(f.rain)}% גשם">
    <span class="wx-day">${label}</span>
    ${icon(ic, 34, col)}
    <span class="wx-t">${num(f.hi)}°<small> / ${num(f.lo)}°</small></span>
    <span class="wx-place">${esc(d.place)}</span>
    <span class="wx-c" style="color:var(--rain)">${num(f.rain)}% גשם</span>
    <span class="wx-c">${esc(f.phrase || '')}</span>
  </a>`;
}

function wxToday(iso){
  const f = fcOf(iso), d = dayOf(iso);
  if (!f || !d) return '';
  const ic = f.ic || accIc(f.icon), col = ic === 'rain' ? 'var(--rain)' : 'var(--accent)';
  const hrs = Array.isArray(f.hours) ? f.hours.slice(0, 14) : [];
  return `<div class="wx-today">
    <div class="wt-top">
      <div>
        <span class="wx-day">היום · ${esc(d.place)}</span>
        <span class="wt-big">${num(f.hi)}°<small> / ${num(f.lo)}°</small></span>
        <span class="wt-ph">${esc(f.phrase || '')}</span>
      </div>
      ${icon(ic, 56, col)}
    </div>
    <div class="wt-meta">
      <span>סיכוי לגשם <b>${num(f.rain)}%</b></span>
      ${f.rainMm != null ? `<span>כמות <b>${esc(f.rainMm)} מ"מ</b></span>` : ''}
      ${f.sunset ? `<span>שקיעה <b>${esc(f.sunset)}</b></span>` : ''}
    </div>
    ${hrs.length ? `<div class="hours" role="list" aria-label="תחזית לפי שעות">${hrs.map(h => {
      const hi = h.ic || accIc(h.icon);
      return `<div class="hr" role="listitem"><span class="ht">${esc(h.time || '')}</span>${icon(hi, 24, hi === 'rain' ? 'var(--rain)' : 'var(--accent)')}<span class="hv">${num(h.t)}°</span><span class="hp">${num(h.rain)}%</span></div>`;
    }).join('')}</div>` : ''}
  </div>`;
}

/* תחזית חיה מ-Open-Meteo, נשמרת בטלפון לשימוש בלי קליטה */
const COORDS = {
  'San José':[9.933,-84.083], 'La Fortuna':[10.470,-84.650], 'Bijagua':[10.730,-85.060], 'Curubandé':[10.730,-85.410],
  'Monteverde':[10.300,-84.820], 'Santa Teresa':[9.645,-85.168], 'Dominical':[9.253,-83.862], 'Orosí':[9.800,-83.850], 'Puerto Viejo':[9.645,-82.705]
};
const WMO = c => {
  c = Number(c);
  if (c <= 1) return ['sun', c === 0 ? 'בהיר' : 'בהיר בעיקר'];
  if (c === 2) return ['partly', 'מעונן חלקית'];
  if (c === 3) return ['cloud', 'מעונן'];
  if (c === 45 || c === 48) return ['cloud', 'ערפל'];
  if (c >= 51 && c <= 57) return ['rain', 'טפטוף'];
  if (c >= 61 && c <= 67) return ['rain', 'גשם'];
  if (c >= 80 && c <= 82) return ['rain', 'ממטרים'];
  if (c >= 95) return ['rain', 'סופות רעמים'];
  return ['cloud', ''];
};
const WX_KEY = 'cr-weather-v1';
try { const c = JSON.parse(localStorage.getItem(WX_KEY) || 'null'); if (c && Array.isArray(c.days)) WX = c; } catch (e) {}

async function loadWeather(){
  const today = todayISO();
  if (today > TRIP.end) return;
  const base = today < TRIP.start ? TRIP.start : today;
  if (diffDays(today, base) > 13) return;            // תחזית זמינה רק כשבועיים קדימה
  const dates = [0,1,2].map(i => addDays(base, i)).filter(d => dayOf(d));
  const places = [...new Set(dates.map(d => dayOf(d).place))].filter(p => COORDS[p]);
  const res = {};
  await Promise.all(places.map(async p => {
    const [la, lo] = COORDS[p];
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&timezone=America%2FCosta_Rica&forecast_days=16`
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunset'
      + '&hourly=temperature_2m,precipitation_probability,weather_code,is_day';
    const r = await fetch(u);
    if (!r.ok) throw new Error('weather ' + r.status);
    res[p] = await r.json();
  }));
  const days = [];
  dates.forEach((date, i) => {
    const p = dayOf(date).place, j = res[p]; if (!j) return;
    const k = j.daily.time.indexOf(date); if (k < 0) return;
    const [ic, ph] = WMO(j.daily.weather_code[k]);
    const day = { date, place:p, hi:j.daily.temperature_2m_max[k], lo:j.daily.temperature_2m_min[k], ic, phrase:ph,
      rain:j.daily.precipitation_probability_max[k], rainMm:Math.round((j.daily.precipitation_sum[k] || 0) * 10) / 10 };
    if (i === 0) {
      day.sunset = String(j.daily.sunset[k] || '').slice(11, 16);
      day.hours = [];
      j.hourly.time.forEach((t, h) => {
        if (t.slice(0, 10) === date && j.hourly.is_day[h] === 1) {
          const [hic] = WMO(j.hourly.weather_code[h]);
          day.hours.push({ time:t.slice(11, 16), t:j.hourly.temperature_2m[h], ic:hic, rain:j.hourly.precipitation_probability[h] });
        }
      });
    }
    days.push(day);
  });
  if (!days.length) return;
  const now = new Date();
  WX = { updatedAt: `${isoOf(now)}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`, days };
  try { localStorage.setItem(WX_KEY, JSON.stringify(WX)); } catch (e) {}
  const key = (location.hash || '#home').slice(1);
  if (key === 'home' || !ROUTES[key]) render(true);
}
setTimeout(() => loadWeather().catch(() => {}), 0);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadWeather().catch(() => {}); });

  // קוביות מזג אוויר: היום + יומיים, לפי המיקום בתכנית. לפני הטיול – שלושת הימים הראשונים.

        d.plan ? d.plan.acts.filter(a => a.kind !== 'alt').map(a => `<li>${icon('dot',20, a.kind ? 'var(--muted)' : 'var(--accent)')}<span><b>${esc(a.n)}</b> ${diffChip(a.n)}${a.kind ? ` <span style="color:var(--muted);font-size:15px">· ${KIND[a.kind]}</span>` : ''}</span></li>`).join('') : ''}</ul>
      ${d.plan && d.plan.rule ? `<p class="tip" style="margin:0">${esc(d.plan.rule)}</p>` : ''}
      ${d.stay ? `<span style="font-size:16px;color:var(--fg-2)">לינה הלילה: <b>${esc(d.stay.name)}</b></span>` : ''}
      <a class="linkbtn" href="#journey">${icon('map',20)}לפרטי היום במסע</a>
    </div>`;
  } else if (before) {
    const first = DAYS[0];
    summary = `<div class="summary">
      <span class="label">היום</span>
      <span class="loc">עוד לא יצאנו</span>
      <ul>
        <li>${icon('plane',20)}<span>הטיסה הבאה: ${FLIGHTS.legs[0].label} ב-05:15 מנתב"ג<br><span style="color:var(--muted);font-size:15px">כדאי להגיע לשדה 3 שעות לפני</span></span></li>
        <li>${icon('bed',20)}<span>לילה ראשון: ${esc(first.stay.name)}, ${esc(first.stay.area)}</span></li>

  } else {
    summary = `<div class="summary"><span class="loc">ברוכים השבים</span><p class="sub">הטיול הסתיים ב-${short(TRIP.end)}.</p></div>`;
  }

  return `<header class="band gut">

    </header>
    <main class="gut">
      ${wxBlock ? `<section class="blk">
        <p class="label">${before ? 'מזג אוויר בימים הראשונים' : 'מזג אוויר לפי המסלול'}</p>

/* ================= מסע ================= */
const dirUrl = (o, d, via) => 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + encodeURIComponent(o) + '&destination=' + encodeURIComponent(d) + (via && via.length ? '&waypoints=' + encodeURIComponent(via.join('|')) : '');
const tideUrl = p => 'https://www.google.com/search?q=' + encodeURIComponent('tide times ' + p);
const lk = (href, label, ic) => `<a class="lk" href="${href}" target="_blank" rel="noopener">${ic ? icon(ic,18) : ''}${label}</a>`;

function routeHTML(d){
  const x = d.x || {};
  const parts = [];
  if (d.route) {
    parts.push(lk(dirUrl(d.route.o, d.route.d, x.via), 'מסלול הנסיעה', 'map'));
    parts.push(lk(wazeUrl(d.route.d), 'Waze ליעד', 'pin'));
  }
  if (x.tide) parts.push(lk(tideUrl(x.tide), 'טבלת גאות ושפל', 'clock'));
  if (x.link) parts.push(lk(x.link.u, esc(x.link.t)));
  return parts.length ? `<div class="links">${parts.join('')}</div>` : '';
}

function extraHTML(d){
  const x = d.x || {};
  return `${x.tip ? `<p class="tip">${esc(x.tip)}</p>` : ''}
    ${x.bring && x.bring.length ? `<div class="bringwrap"><span class="label">מה לקחת</span><div class="bring">${x.bring.map(b => `<span>${esc(b)}</span>`).join('')}</div></div>` : ''}`;
}

function actsHTML(p){
  if (!p) return '';
  return `<ul class="acts">${p.acts.map(a => {
      const inf = INFO[a.n] || {};
      const links = [];
      if (inf.q) { links.push(lk(mapsUrl(inf.q), 'מפה', 'pin')); links.push(lk(wazeUrl(inf.q), 'Waze')); }
      if (inf.book) links.push(lk(inf.book, 'כרטיסים ב-SINAC', 'ticket'));
      return `<li class="act ${a.kind || ''}">
      <div class="an"><b>${esc(a.n)}</b>${diffChip(a.n)}${a.kind ? `<span class="kchip">${KIND[a.kind]}</span>` : ''}</div>
      <p>${esc(a.d)}</p>
      ${DIFF[a.n] && DIFF[a.n][1] ? `<p class="dwhy"><b>הליכה:</b> ${esc(DIFF[a.n][1])}</p>` : ''}
      ${a.tip ? `<p class="atip"><b>טיפ:</b> ${esc(a.tip)}</p>` : ''}
      ${a.g ? `<p class="ag">מדריך: ${esc(a.g)}</p>` : ''}
      ${inf.info ? `<ul class="info">${inf.info.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      ${links.length ? `<div class="links">${links.join('')}</div>` : ''}
    </li>`; }).join('')}</ul>
    ${p.g ? `<p class="ag">מדריך: ${esc(p.g)}</p>` : ''}
    ${p.rule ? `<p class="tip"><b>עיקרון היום:</b> ${esc(p.rule)}</p>` : ''}`;
}
function journey(){
  const today = todayISO();
  const picks = DAYS.map(d => `<button type="button" data-goto="day-${d.n}" class="${d.date===today?'today':''}" aria-label="יום ${d.n}, ${short(d.date)}"><small>${short(d.date)}</small><b>${d.n}</b></button>`).join('');
  const cards = DAYS.map(d => `
    <article class="day ${d.date===today?'today':''}" id="day-${d.n}">
      <div class="dh"><span class="dn">יום ${d.n}</span><span class="dd">${longDate(d.date)}</span></div>
      <h3>${esc(d.title)}</h3>
      ${d.items.length ? `<ul class="tl log">${d.items.map(x => `<li>${icon(x.ic,20, 'var(--muted)')}<span>${esc(x.t)}${x.m ? `<br><span class="m">${esc(x.m)}</span>` : ''}</span></li>`).join('')}</ul>` : ''}
      ${routeHTML(d)}
      ${actsHTML(d.plan)}
      ${extraHTML(d)}
      ${d.tip ? `<p class="tip">${esc(d.tip)}</p>` : ''}
      ${d.stay ? `<span style="font-size:16px;color:var(--muted)">לינה: <span style="color:var(--fg)">${esc(d.stay.name)}</span></span>` : ''}
    </article>`).join('');
  return `<header class="band gut">
      <h1>המסע</h1>
      <p class="sub">${TRIP_DAYS} ימים · ${HOTELS.length} מקומות לינה · ${short(TRIP.start)}–${short(TRIP.end)}</p>
    </header>
    <div class="pickbar gut"><nav class="daypick" aria-label="קפיצה ליום">${picks}</nav></div>
    <main class="gut"><p class="note-sm">דרגת הקושי מתייחסת להולך בן 60 בכושר בינוני עם חולשה ברגל שמאל: <span class="dchip e">קל</span> <span class="dchip m">בינוני</span> <span class="dchip h">קשה</span></p>${cards}</main>`;
}

/* רשימת הזמנות מראש – הסימון נשמר בדפדפן של הצופה בלבד */
const DONE_KEY = 'cr-tobook-done';
function doneSet(){ try { return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]')); } catch (e) { return new Set(); } }
function saveDone(s){ try { localStorage.setItem(DONE_KEY, JSON.stringify([...s])); } catch (e) {} }

function tobook(){
  const done = doneSet();
  const rows = TOBOOK.map(b => `<div class="ck ${done.has(b.id)?'done':''}">
      <input type="checkbox" id="bk-${b.id}" data-book="${b.id}" ${done.has(b.id)?'checked':''}>
      <label for="bk-${b.id}">
        <span class="cd">${b.when || (short(b.date) + ' · יום ' + (diffDays(TRIP.start, b.date) + 1))}</span>
        <span class="ct">${esc(b.t)}</span>

  return bandHeader('להזמין מראש', 'כרטיסים וסיורים שדורשים הזמנה. סמן מה כבר הוזמן.', 'bookings') + `<main class="gut">

    <p class="tip"><b>אם האתר לא נפתח:</b> זו תקלה מוכרת באתר של SINAC, לפעמים ליום שלם. לנסות שוב מאוחר יותר, בחלון גלישה בסתר או מהמחשב. Corcovado ו-Isla del Caño לא נמכרים באתר, אלא דרך מפעיל הסיור.</p>
    <div class="check">${rows}</div>
    <p class="note-sm">הסימון נשמר רק בטלפון הזה.</p>

function segHTML(s){
  if (s.layover) return `<div class="lay">${icon('clock',20,'var(--muted)')}<span>עצירה ב${s.layover} · <b>${s.dur}</b></span></div>`;
  const end = p => `<div class="end">
      <span class="tm">${p.time}${p.plus ? `<small style="font-size:15px;color:var(--muted)"> ${p.plus}</small>` : ''}</span>
      ${p.old ? `<span class="old">היה ${p.old}</span>` : ''}
      <span class="ap">${p.code}</span>
      <span class="ci">${p.city}${p.term ? ' · ' + p.term : ''}</span>
    </div>`;
  return `<div class="seg">
    <div class="ends">${end(s.from)}
      <svg width="28" height="28" viewBox="0 0 24 24" role="img" aria-label="אל" style="color:var(--accent);flex-shrink:0"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M19 12H5m7 7-7-7 7-7"/></svg>
      ${end(s.to)}</div>
    <div class="meta"><span><b>${s.flight}</b> · ${s.op}</span><span>${s.plane}</span><span>מושב: ${s.seat}</span></div>
  </div>`;
}

/* ================= ניתוב ================= */
const ROUTES = { home, journey, bookings, flights, car, hotels, tobook, insurance };
const TAB_OF = { home:'home', journey:'journey', bookings:'bookings', flights:'bookings', car:'bookings', hotels:'bookings', tobook:'bookings', insurance:'bookings' };

$view.addEventListener('change', e => {
  const cb = e.target.closest('[data-book]');
  if (!cb) return;
  const s = doneSet();
  cb.checked ? s.add(cb.dataset.book) : s.delete(cb.dataset.book);
  saveDone(s);
  cb.closest('.ck').classList.toggle('done', cb.checked);
});

function render(keep){
  const key = (location.hash || '#home').slice(1);
  const r = ROUTES[key] ? key : 'home';
  $view.innerHTML = ROUTES[r]();
  if (!keep) { $view.classList.remove('view'); void $view.offsetWidth; $view.classList.add('view'); }
  document.querySelectorAll('nav.tabs a').forEach(a => a.dataset.tab === TAB_OF[r] ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  if (!keep) window.scrollTo(0,0);
  if (r === 'journey') requestAnimationFrame(markDay);
  if (r === 'journey' && !keep) {
    const t = document.querySelector('.day.today');
    if (t) t.scrollIntoView({block:'start'});
    const b = document.querySelector('.daypick .today');
    if (b) b.scrollIntoView({inline:'center', block:'nearest'});
  }
}

$view.addEventListener('click', e => {
  const g = e.target.closest('[data-goto]');
  if (g) { const el = document.getElementById(g.dataset.goto); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  const c = e.target.closest('[data-copy]');
  if (c) {
    const v = c.dataset.copy;
    try { navigator.clipboard.writeText(v).then(() => toast('הועתק: ' + v), () => toast(v)); }
    catch (err) { toast(v); }
  }
});

/* סרגל הימים: מסמן את היום שמוצג כרגע בזמן גלילה */
function markDay(){
  const bar = document.querySelector('.pickbar'); if (!bar) return;
  const y = bar.getBoundingClientRect().bottom + 48;
  let cur = null;
  document.querySelectorAll('.day').forEach(d => { if (d.getBoundingClientRect().top <= y) cur = d; });
  if (!cur) cur = document.querySelector('.day');
  if (!cur) return;
  const nav = bar.querySelector('.daypick');
  nav.querySelectorAll('button').forEach(b => {
    const on = b.dataset.goto === cur.id;
    if (on && !b.classList.contains('cur')) nav.scrollTo({ left: b.offsetLeft - nav.clientWidth / 2 + b.offsetWidth / 2 });
    b.classList.toggle('cur', on);
  });
}
let pickRaf = 0;
window.addEventListener('scroll', () => { if (pickRaf) return; pickRaf = requestAnimationFrame(() => { pickRaf = 0; markDay(); }); }, { passive: true });

let tt;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2000); }
window.addEventListener('hashchange', () => render(false));
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
render();
</script>
